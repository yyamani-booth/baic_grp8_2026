<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Liaison (prototype)</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f5f6f8; color: #222; }
  header { background: #1f3a5f; color: #fff; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; }
  header h1 { margin: 0; font-size: 20px; }
  #stepper span { margin-left: 14px; opacity: .5; }
  #stepper span.on { opacity: 1; font-weight: bold; text-decoration: underline; }
  #layout { display: flex; gap: 16px; padding: 16px; align-items: flex-start; }
  #main { flex: 1; background: #fff; border-radius: 8px; padding: 20px; min-width: 0; }
  #side { width: 340px; background: #fff; border-radius: 8px; padding: 14px; position: sticky; top: 8px; }
  #side h3 { margin: 0 0 6px; font-size: 15px; }
  #log { max-height: 55vh; overflow-y: auto; font-size: 12px; font-family: ui-monospace, monospace; border-top: 1px solid #ddd; }
  #log div { padding: 3px 0; border-bottom: 1px dotted #ddd; }
  .rej { color: #b3261e; } .acc { color: #1b7a3a; }
  textarea, input[type=text] { width: 100%; box-sizing: border-box; padding: 8px; font: inherit; border: 1px solid #aaa; border-radius: 6px; }
  textarea { min-height: 90px; }
  button { padding: 7px 14px; border: 1px solid #1f3a5f; background: #1f3a5f; color: #fff; border-radius: 6px; cursor: pointer; font: inherit; }
  button.sec { background: #fff; color: #1f3a5f; }
  button:disabled { opacity: .4; cursor: default; }
  .row { display: flex; gap: 8px; align-items: center; margin: 10px 0; flex-wrap: wrap; }
  .card { border: 1px solid #ddd; border-radius: 8px; padding: 12px; margin: 10px 0; background: #fafbfc; }
  .tabs button { margin-right: 6px; }
  .tabs button.active { background: #e8a33d; border-color: #e8a33d; color: #000; }
  .chip { display: inline-block; padding: 2px 8px; border-radius: 10px; background: #e3e8ef; font-size: 12px; margin: 2px; }
  .chip.hard { background: #fde1df; color: #8a1c14; }
  .day h3 { margin: 18px 0 6px; border-bottom: 2px solid #1f3a5f; }
  .item { display: flex; gap: 10px; padding: 8px; border-bottom: 1px solid #eee; align-items: flex-start; }
  .item.final { background: #eef8f0; }
  .item .txt { flex: 1; }
  .item .slot { font-weight: bold; }
  .item .note { font-size: 12px; color: #7a5200; }
  .item .warn { font-size: 13px; color: #8a1c10; background: #fdecea; border-left: 3px solid #c0392b; padding: 4px 8px; margin: 4px 0; }
  .warnbox { background: #fdecea; border-color: #c0392b; }
  .votes { font-size: 12px; color: #555; }
  .small { font-size: 12px; color: #666; }
  .ok { color: #1b7a3a; font-weight: bold; }
</style>
</head>
<body>
<header>
  <h1>Liaison <span class="small" style="color:#cde" id="mode">prototype: simulated AI</span></h1>
  <div id="stepper"></div>
</header>
<div id="layout">
  <div id="main">Loading…</div>
  <div id="side">
    <h3>Status</h3>
    <div id="status" class="small"></div>
    <h3 style="margin-top:12px">Captured feedback &amp; action log</h3>
    <div id="log"></div>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
